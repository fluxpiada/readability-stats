[project]
name = "readability-stats"
version = "0.1.0"
description = "Readability, pacing and lexical-diversity stats for a markdown or .docx manuscript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "nltk>=3.8",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[dependency-groups]
# Nederlandse analyse (nl/). Los van de kerndependencies, zodat de Engelse
# scripts in de root licht blijven: uv sync --group nl
nl = [
    "spacy>=3.7,<4",
    "pyphen>=0.15",
    # Bevroren dataset (zie nl/README.md); pinnen houdt scores tussen runs vergelijkbaar.
    "wordfreq==3.1.1",
    "nl-core-news-sm",
]
# De grotere taalmodellen, elk in een eigen groep. Ze staan hier en niet los
# erbuiten omdat `uv sync` de omgeving gelijkmaakt aan uv.lock: een model dat
# met `uv pip install` binnenkwam en dus niet in de lock staat, werd bij de
# volgende start weer weggegooid. Zo staan ze wél in de lock en blijven ze.
nl-md = ["nl-core-news-md"]
nl-lg = ["nl-core-news-lg"]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["nl/tests", "tests"]
pythonpath = ["nl", "."]

[tool.uv]
package = false

[tool.uv.sources]
# De spaCy-modellen komen niet van PyPI. De wheel-URL is reproduceerbaar en
# werkt binnen uv; `python -m spacy download` doet dat niet. Alle drie de
# versies moeten met de spaCy-minor meebewegen en dus gelijk blijven.
nl-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_sm-3.8.0/nl_core_news_sm-3.8.0-py3-none-any.whl" }
nl-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_md-3.8.0/nl_core_news_md-3.8.0-py3-none-any.whl" }
nl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl" }
