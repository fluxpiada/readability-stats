[project]
name = "readability-stats"
version = "0.1.0"
description = "Readability, pacing and lexical-diversity stats for a markdown or .docx manuscript"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "nltk>=3.8",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[tool.uv]
package = false
